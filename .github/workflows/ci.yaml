name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate CI version
        id: version
        shell: pwsh
        run: |
          $rawVersion = (npx --yes git-cliff --config cliff.toml --bumped-version).Trim()
          $version = $rawVersion.TrimStart('v').Split('-')[0]

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "git-cliff returned an invalid semantic version: $rawVersion"
          }

          "version=$version-ci.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build, test and pack
        shell: pwsh
        run: ./build.ps1 --target Pack --package-version ${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
