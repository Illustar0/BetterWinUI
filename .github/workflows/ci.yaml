name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate CI version
        id: version
        shell: pwsh
        run: |
          $rawVersion = (npx --yes git-cliff --config cliff.toml --bumped-version).Trim()
          $version = $rawVersion.TrimStart('v')

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "git-cliff returned an invalid semantic version: $rawVersion"
          }

          "version=$version-ci.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/BetterWinUI.slnx

      - name: Build
        run: dotnet build src/BetterWinUI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/BetterWinUI.slnx --configuration Release --no-build

      - name: Pack
        shell: pwsh
        run: |
          $projects = @(
            'src/BetterWinUI.Navigation/BetterWinUI.Navigation.csproj',
            'src/BetterWinUI.Navigation.Frame/BetterWinUI.Navigation.Frame.csproj',
            'src/BetterWinUI.DependencyInjection.PageActivation/BetterWinUI.DependencyInjection.PageActivation.csproj'
          )

          foreach ($project in $projects) {
            dotnet pack $project `
              --configuration Release `
              --no-build `
              --output artifacts `
              -p:Version=${{ steps.version.outputs.version }}
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          if-no-files-found: error
